# Konfigurasi nginx untuk SPA fe-pineapple (dipakai di Docker runtime).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/json application/javascript application/xml image/svg+xml;
  gzip_vary on;

  # File hasil build Vite punya hash di namanya -> cache lama aman.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # env.js selalu fresh karena isinya digenerate dari env container.
  location = /env.js {
    expires off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
